<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Screenshot Stitcher</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <h1 id="app-title">Screenshot Stitcher</h1>
      <p id="app-description" class="app-description"></p>
    </header>

    <section class="control-panel" aria-labelledby="app-title">
      <input
        id="file-input"
        class="visually-hidden"
        type="file"
        accept="image/png,image/*"
        multiple
      >

      <button id="select-files-button" type="button" class="primary-control"></button>
      <p id="selected-files-status" class="status-text" aria-live="polite"></p>

      <label id="output-file-name-label" for="output-file-name"></label>
      <input
        id="output-file-name"
        class="text-input"
        type="text"
        value="stitched-screenshot"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >

      <button id="stitch-button" type="button" class="primary-control"></button>
      <button id="reset-button" type="button" class="secondary-control"></button>

      <p id="process-status" class="status-text" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
